const MAX_ROWS = 6;
const APP_VERSION = "1.2.0";
const APP_VERSION_DATE = "2026-08-14";
const CURRENCY_CONFIG = {
  KRW: { unit: "ウォン", presets: [10000, 30000, 50000, 100000], step: 10000 },
  JPY: { unit: "円", presets: [1000, 3000, 5000, 10000], step: 1000 },
  USD: { unit: "ドル", presets: [10, 30, 50, 100], step: 10 },
};

// ---- pure helpers -------------------------------------------------------
function outcomeFor(h, settings) {
  if (!h.bet) return { result: null, delta: 0 };
  const amt = h.betAmount || 0;
  if (h.bet === h.type) {
    if (h.bet === "B") {
      // Banker-6 rule: a Banker win by exactly 6 pays only half, and this
      // supersedes the normal commission math (that's the whole point of the rule).
      const delta = h.banker6 ? amt * 0.5 : (settings.commission ? amt * 0.95 : amt);
      return { result: "win", delta };
    }
    if (h.bet === "P") return { result: "win", delta: amt };
    if (h.bet === "T") return { result: "win", delta: amt * settings.tiePayout };
  }
  if (h.type === "T" && h.bet !== "T") return { result: "push", delta: 0 };
  return { result: "lose", delta: -amt };
}

function computeBigRoad(history, settings) {
  const cells = {};
  let col = -1, row = -1, lastType = null, started = false, maxCol = -1;
  for (const h of history) {
    const outcome = outcomeFor(h, settings).result;
    if (!started) {
      col = 0; row = 0; started = true;
    } else if (h.type === "T") {
      // タイは列を変えず、直前の結果の続きとして同じ列の下に入る
      if (row + 1 < MAX_ROWS) row += 1; else col += 1;
    } else if (h.type === lastType) {
      if (row + 1 < MAX_ROWS) row += 1; else col += 1;
    } else {
      col += 1; row = 0;

    cells[`${col}-${row}`] = { type: h.type, banker6: h.banker6, outcome };

function computeBeadPlate(history) {
  return history.map((h, i) => ({ ...h, col: Math.floor(i / MAX_ROWS), row: i % MAX_ROWS }));
}

function computeStreak(history) {
  const nonTie = history.filter((h) => h.type !== "T");
  if (nonTie.length === 0) return { type: null, count: 0 };
  const last = nonTie[nonTie.length - 1].type;

  for (let i = nonTie.length - 2; i >= 0; i--) { if (nonTie[i].type === last) count += 1; else break; }

function computeSelfStats(history, settings) {
  let wins = 0, losses = 0, pushes = 0, net = 0;
  const outcomes = [];
  for (const h of history) {
    const o = outcomeFor(h, settings);
    if (o.result === "win") wins += 1;
    else if (o.result === "lose") losses += 1;
    else if (o.result === "push") pushes += 1;

    else if (outcomes[i] === streakType) streakCount += 1;

}

function computeBetTotals(history) {
  let totalBets = 0, totalWagered = 0;
  for (const h of history) {
    if (h.bet) { totalBets += 1; totalWagered += h.betAmount || 0; }

  return { totalBets, totalWagered };

function computeRecentStats(history, n) {
  const recent = history.slice(-n);
  const b = recent.filter((h) => h.type === "B").length;
  const p = recent.filter((h) => h.type === "P").length;
  const t = recent.filter((h) => h.type === "T").length;
  return { b, p, t, total: recent.length };

function computeRuns(history) {

}
function deriveMarkers(runs, k) {

    const len = runs[i].length;

    lastType = t;
    if (col > maxCol) maxCol = col;
  }
  return { cells, cols: maxCol + 1 };
}
function computeDerivedRoads(history) {
  const runs = computeRuns(history);
  return {
    bigEye: layoutRoad(deriveMarkers(runs, 1)),
    smallRoad: layoutRoad(deriveMarkers(runs, 2)),
    cockroach: layoutRoad(deriveMarkers(runs, 3)),
  };
}

// 標準的な8デッキシューの理論出現率(参考値)
const THEORETICAL_PCT = { B: 45.86, P: 44.62, T: 9.52 };

// 特定の局(トリガー)の直後に何が出たかの分布(B/P/T)。「バンカー6の次」「タイの次」などに使う。
function computeFollowingStats(history, predicateFn) {
  let b = 0, p = 0, t = 0, total = 0;
  for (let i = 0; i < history.length - 1; i++) {
    if (predicateFn(history[i])) {
      const next = history[i + 1];
      if (next.type === "B") b += 1;
      else if (next.type === "P") p += 1;
      else t += 1;
      total += 1;
    }
  }
  return { b, p, t, total };
}

// 連続数が N 以上まで伸びた割合(このシューの連の長さの分布)
function computeStreakContinuation(history) {
  const runs = computeRuns(history);
  const total = runs.length;
  const levels = [];
  for (let n = 2; n <= 6; n++) {
    const count = runs.filter((r) => r.length >= n).length;
    levels.push({ n, count, pct: total ? (count / total) * 100 : 0 });
  }
  return { total, levels };
}

function computeTableStats(history) {
  const runs = computeRuns(history); // ties excluded, same as derived roads
  const totalRuns = runs.length;
  const avgStreak = totalRuns ? runs.reduce((s, r) => s + r.length, 0) / totalRuns : 0;
  const dragonCount = runs.filter((r) => r.length >= 6).length;
  const chopCount = runs.filter((r) => r.length === 1).length;
  const chopRate = totalRuns ? (chopCount / totalRuns) * 100 : 0;

  const total = history.length;
  const bWins = history.filter((h) => h.type === "B").length;
  const pWins = history.filter((h) => h.type === "P").length;
  const bPct = total ? (bWins / total) * 100 : 0;
  const pPct = total ? (pWins / total) * 100 : 0;
  const tPct = total ? (history.filter((h) => h.type === "T").length / total) * 100 : 0;

  const decidedTotal = bWins + pWins; // ties excluded from denominator
  const bPctNoTie = decidedTotal ? (bWins / decidedTotal) * 100 : 0;
  const pPctNoTie = decidedTotal ? (pWins / decidedTotal) * 100 : 0;

  const banker6Count = history.filter((h) => h.banker6).length;
  const banker6RateOfTotal = total ? (banker6Count / total) * 100 : 0;
  const banker6RateOfBankerWins = bWins ? (banker6Count / bWins) * 100 : 0;

  return {
    avgStreak, dragonCount, chopRate, totalRuns,
    bPct, pPct, tPct,
    bPctNoTie, pPctNoTie, decidedTotal,
    bDiff: bPct - THEORETICAL_PCT.B,
    pDiff: pPct - THEORETICAL_PCT.P,
    tDiff: tPct - THEORETICAL_PCT.T,
    banker6Count, banker6RateOfTotal, banker6RateOfBankerWins,
  };
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawRoadCellCanvas(ctx, cell, x, y, size) {
  ctx.strokeStyle = INK.paperShadow;
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, size, size);
  if (!cell) return;
  const color = cell.type === "B" ? INK.banker : cell.type === "P" ? INK.player : INK.tie;
  const isWin = cell.outcome === "win";
  const fill = isWin ? color : null;
  const textColor = isWin ? INK.paper : color;
  const cx = x + size / 2, cy = y + size / 2, r = size * 0.34;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  ctx.lineWidth = 2;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.fillStyle = textColor;
  ctx.font = "bold 12px 'JetBrains Mono', monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(cell.type, cx, cy + 1);
  if (cell.banker6) {
    const gx = x + 6, gy = y + 6, gr = 7;
    ctx.beginPath();
    ctx.arc(gx, gy, gr, 0, Math.PI * 2);
    ctx.fillStyle = INK.brass;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = INK.feltDark;
    ctx.stroke();
    ctx.fillStyle = INK.feltDark;
    ctx.font = "bold 9px 'JetBrains Mono', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("⑥", gx, gy + 0.5);
  }
}

                  <span style={{ fontSize: 13, fontWeight: 700, color: h.type === "B" ? INK.banker : h.type === "P" ? INK.player : INK.tie, width: 26, flexShrink: 0 }}>{h.type}{h.banker6 ? "⑥" : ""}</span>
                  <span style={{ fontSize: 13, fontWeight: 700, color: sideColorOf(h.bet), width: 16, textAlign: "center", flexShrink: 0 }}>{h.bet || "-"}</span>

                  <span style={{ fontSize: 14, color: INK.brassDim, flexShrink: 0 }}>✏️</span>
                </div>
              );
            }
            return renderDraftForm(`#${idx} を編集`, i);
          })
        )}
      </div>
      {editIndex !== "new" && (
        <button onClick={startAdd} style={{ width: "100%", padding: "9px 0", borderRadius: "0 0 8px 8px", border: `1px solid ${INK.brass}`, borderTop: "none", background: "rgba(201,162,39,0.10)", color: INK.brass, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
          ＋ 局を追加
        </button>
      )}
    </div>
  );
}

// ---- main app -------------------------------------------------------
function App() {
  const [history, setHistory] = useState([]);
  const [settings, setSettings] = useState({ commission: true, tiePayout: 8, currency: "KRW", showSideBets: true, recentWindow2: 20 });
  const [sessions, setSessions] = useState([]);
  const [ready, setReady] = useState(false);
  const [syncError, setSyncError] = useState(false);
  // (banker6 is set directly by the ⑥ result button — see addResult)
  const [betSide, setBetSide] = useState(null); // persists across hands now
  const [betAmount, setBetAmount] = useState(CURRENCY_CONFIG.KRW.presets[0]);
  const [confirmReset, setConfirmReset] = useState(false);
  const [confirmEndSession, setConfirmEndSession] = useState(false);
  const [activeTab, setActiveTab] = useState("input");
  const [showSettings, setShowSettings] = useState(false);
  const [settingsSaved, setSettingsSaved] = useState(false);
  const [meta, setMeta] = useState(null);
  const [expandedSession, setExpandedSession] = useState(null);
  const [editingHistorySessionId, setEditingHistorySessionId] = useState(null);
  const [flashType, setFlashType] = useState(null);
  const loadedRef = useRef(false);
  const bigRoadScrollRef = useRef(null);

  useEffect(() => {
    try {
      const h = localStorage.getItem("baccarat-road-history");
      if (h) { const parsed = JSON.parse(h); if (Array.isArray(parsed)) setHistory(parsed); }
    } catch (e) {}
    try {
      const s = localStorage.getItem("baccarat-road-settings");
      if (s) {
        const parsed = JSON.parse(s);
        if (parsed) {
          setSettings((prev) => ({ ...prev, ...parsed }));
          if (parsed.betAmount) setBetAmount(parsed.betAmount);
        }
      }
    } catch (e) {}
    try {
      const ss = localStorage.getItem("baccarat-road-sessions");
      if (ss) { const parsed = JSON.parse(ss); if (Array.isArray(parsed)) setSessions(parsed); }
    } catch (e) {}
    loadedRef.current = true;
    setReady(true);
  }, []);

  useEffect(() => { if (!loadedRef.current) return; try { localStorage.setItem("baccarat-road-history", JSON.stringify(history)); } catch (e) { setSyncError(true); } }, [history]);
  useEffect(() => { if (!loadedRef.current) return; try { localStorage.setItem("baccarat-road-settings", JSON.stringify({ ...settings, betAmount })); } catch (e) { setSyncError(true); } }, [settings, betAmount]);
  useEffect(() => { if (!loadedRef.current) return; try { localStorage.setItem("baccarat-road-sessions", JSON.stringify(sessions)); } catch (e) { setSyncError(true); } }, [sessions]);
  useEffect(() => { if (bigRoadScrollRef.current) bigRoadScrollRef.current.scrollLeft = bigRoadScrollRef.current.scrollWidth; }, [history]);
  useEffect(() => {
    const cfg = CURRENCY_CONFIG[settings.currency] || CURRENCY_CONFIG.KRW;
    if (!cfg.presets.includes(betAmount)) setBetAmount(cfg.presets[0]);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [settings.currency]);

  // NOTE: bet side/amount are now sticky — they do NOT reset after each entry.
  const flashTimerRef = useRef(null);
  const addResult = (type, opts) => {
    const banker6 = !!(opts && opts.banker6);
    setHistory((h) => [...h, { type, banker6, bet: betSide, betAmount: betSide ? betAmount : null, ts: Date.now() }]);
    setBetSide(null); // reset which side was chosen — makes it obvious the next round needs a fresh pick
    // betAmount is intentionally NOT reset — carries over to the next round
    setFlashType(type);
    try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
    if (flashTimerRef.current) clearTimeout(flashTimerRef.current);
    flashTimerRef.current = setTimeout(() => setFlashType(null), 550);
  };
  const undo = () => setHistory((h) => h.slice(0, -1));
  const doReset = () => { setHistory([]); setConfirmReset(false); };

  const endSession = () => {
    if (history.length === 0) { setConfirmEndSession(false); return; }
    const self0 = computeSelfStats(history, settings);
    const table0 = computeTableStats(history);
    const b0 = history.filter((h) => h.type === "B").length;
    const p0 = history.filter((h) => h.type === "P").length;
    const t0 = history.filter((h) => h.type === "T").length;
    const session = {
      id: Date.now(),
      startTs: history[0].ts || null,
      endTs: history[history.length - 1].ts || Date.now(),
      history,
      settings: { ...settings },
      total: history.length,
      b: b0, p: p0, t: t0,
      net: self0.net, wins: self0.wins, losses: self0.losses, pushes: self0.pushes,
      // 情報タブの集計(分析結果)も保存時点のスナップショットとして残す
      stats: {
        bPct: table0.bPct, pPct: table0.pPct, tPct: table0.tPct,
        bPctNoTie: table0.bPctNoTie, pPctNoTie: table0.pPctNoTie,
        avgStreak: table0.avgStreak, dragonCount: table0.dragonCount, chopRate: table0.chopRate,
        banker6Count: table0.banker6Count, banker6RateOfTotal: table0.banker6RateOfTotal, banker6RateOfBankerWins: table0.banker6RateOfBankerWins,
      },
    };
    setSessions((s) => [session, ...s]);
    setHistory([]);
    setConfirmEndSession(false);
  };
  const deleteSession = (id) => setSessions((s) => s.filter((x) => x.id !== id));

  const recomputeSessionFields = (hist, sett) => {
    const self0 = computeSelfStats(hist, sett);
    const table0 = computeTableStats(hist);
    return {
      total: hist.length,
      b: hist.filter((h) => h.type === "B").length,
      p: hist.filter((h) => h.type === "P").length,
      t: hist.filter((h) => h.type === "T").length,
      net: self0.net, wins: self0.wins, losses: self0.losses, pushes: self0.pushes,
      startTs: hist.length ? hist[0].ts : null,
      endTs: hist.length ? hist[hist.length - 1].ts : null,
      stats: {
        bPct: table0.bPct, pPct: table0.pPct, tPct: table0.tPct,
        bPctNoTie: table0.bPctNoTie, pPctNoTie: table0.pPctNoTie,
        avgStreak: table0.avgStreak, dragonCount: table0.dragonCount, chopRate: table0.chopRate,
        banker6Count: table0.banker6Count, banker6RateOfTotal: table0.banker6RateOfTotal, banker6RateOfBankerWins: table0.banker6RateOfBankerWins,
      },
    };
  };
  const updatePastSessionEntry = (sessionId, index, newEntry) => {
    setSessions((prev) => prev.map((s) => {
      if (s.id !== sessionId) return s;
      const hist = s.history.slice();
      hist[index] = newEntry;
      return { ...s, history: hist, ...recomputeSessionFields(hist, s.settings) };
    }));
  };
  const deletePastSessionEntry = (sessionId, index) => {
    setSessions((prev) => prev.map((s) => {
      if (s.id !== sessionId) return s;
      const hist = s.history.slice();
      hist.splice(index, 1);
      return { ...s, history: hist, ...recomputeSessionFields(hist, s.settings) };
    }));
  };
  const addPastSessionEntry = (sessionId, newEntry) => {
    setSessions((prev) => prev.map((s) => {
      if (s.id !== sessionId) return s;
      const hist = s.history.concat([newEntry]);
      return { ...s, history: hist, ...recomputeSessionFields(hist, s.settings) };
    }));
  };

  const saveSettingsNow = () => {
    try {
      localStorage.setItem("baccarat-road-settings", JSON.stringify({ ...settings, betAmount }));
      setSyncError(false);
      setSettingsSaved(true);
      setTimeout(() => setSettingsSaved(false), 1800);
    } catch (e) {
      setSyncError(true);
      console.error(e);
    }
  };

  const saveImage = (histArg, settingsArg, labelSuffix) => {
    const h0 = histArg || history;
    const s0 = settingsArg || settings;
    const unit0 = (CURRENCY_CONFIG[s0.currency] || CURRENCY_CONFIG.KRW).unit;
    const fmt0 = (n) => { const r = Math.round(n); return `${r > 0 ? "+" : ""}${r.toLocaleString()}${unit0}`; };
    const d = computeBigRoad(h0, s0);
    const cellsX = d.cells, colsX = d.cols;
    const selfX = computeSelfStats(h0, s0);
    const totalX = h0.length;
    const bX = h0.filter((h) => h.type === "B").length;
    const pX = h0.filter((h) => h.type === "P").length;
    const tX = h0.filter((h) => h.type === "T").length;
    const cellSize = 32;
    const gridCols = Math.max(colsX, 1);
    const width = Math.max(gridCols * cellSize + 40, 400);
    const headerH = 110;
    const roadH = MAX_ROWS * cellSize + 16;
    const height = headerH + roadH + 40;

    const canvas = document.createElement("canvas");
    const scale = 2;
    canvas.width = width * scale; canvas.height = height * scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, INK.feltLight); grad.addColorStop(1, INK.feltDark);
    ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = INK.paper; ctx.textAlign = "center";
    ctx.font = "bold 22px 'Shippori Mincho', serif";
    ctx.fillText("罫線帳 BACCARAT LEDGER", width / 2, 28);

    const now = new Date();
    const pad2 = (n) => String(n).padStart(2, "0");
    const headerLabel = labelSuffix
      ? labelSuffix
      : `${now.getFullYear()}/${pad2(now.getMonth() + 1)}/${pad2(now.getDate())} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
    ctx.font = "11px 'JetBrains Mono', monospace";
    ctx.fillStyle = INK.creamDim;
    ctx.fillText(headerLabel, width / 2, 44);

    ctx.textAlign = "left";
    ctx.font = "12px 'JetBrains Mono', monospace";
    ctx.fillStyle = INK.paper;
    ctx.fillText(`総局数 ${totalX}　B ${bX}　P ${pX}　T ${tX}`, 16, 64);
    ctx.fillStyle = selfX.net > 0 ? INK.win : selfX.net < 0 ? INK.player : INK.paper;
    ctx.fillText(`収支 ${fmt0(selfX.net)}　成績 ${selfX.wins}-${selfX.losses}-${selfX.pushes}`, 16, 82);

    const roadTop = headerH - 10;
    ctx.fillStyle = INK.paper;
    roundRectPath(ctx, 16, roadTop, width - 32, roadH, 6); ctx.fill();
    ctx.strokeStyle = INK.brass; ctx.lineWidth = 1.5;
    roundRectPath(ctx, 16, roadTop, width - 32, roadH, 6); ctx.stroke();
    for (let c = 0; c < gridCols; c++) {
      for (let r = 0; r < MAX_ROWS; r++) {
        drawRoadCellCanvas(ctx, cellsX[`${c}-${r}`], 24 + c * cellSize, roadTop + 8 + r * cellSize, cellSize);
      }
    }

    const filename = `baccarat-road-${now.getFullYear()}${pad2(now.getMonth() + 1)}${pad2(now.getDate())}-${pad2(now.getHours())}${pad2(now.getMinutes())}.png`;
    canvas.toBlob(async (blob) => {
      if (!blob) return;
      try {
        const file = new File([blob], filename, { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: "罫線帳" });
          return;
        }
      } catch (e) {}
      const dataUrl = canvas.toDataURL("image/png");
      const link = document.createElement("a");
      link.href = dataUrl; link.download = filename;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }, "image/png");
  };

  const { cells, cols } = computeBigRoad(history, settings);
  const beadPlate = computeBeadPlate(history);
  const beadCols = Math.max(1, Math.ceil(history.length / MAX_ROWS));
  const streak = computeStreak(history);
  const self = computeSelfStats(history, settings);
  const recent10 = computeRecentStats(history, 10);
  const recent20 = computeRecentStats(history, settings.recentWindow2);
  const derived = computeDerivedRoads(history);
  const tableStats = computeTableStats(history);
  const total = history.length;
  const bCount = history.filter((h) => h.type === "B").length;
  const pCount = history.filter((h) => h.type === "P").length;
  const colArray = Array.from({ length: Math.max(cols, 1) }, (_, c) => c);
  const beadColArray = Array.from({ length: beadCols }, (_, c) => c);

  const unit = currencyCfg.unit;
  const presets = currencyCfg.presets;
  const step = currencyCfg.step;

  const fmtTime = (ts) => {
    if (!ts) return "-";

    return `${p2(d.getHours())}:${p2(d.getMinutes())}`;

      >
        <span style={{ fontSize: side ? 20 : 18, fontWeight: 800, letterSpacing: "0.08em", fontFamily: "'JetBrains Mono', monospace" }}>{enLabel}</span>
        <span style={{ fontSize: 16, opacity: 0.85, letterSpacing: "0.05em" }}>{jpLabel}</span>
      </button>
    );
  };

  // approx height of the fixed bottom panel so scroll content doesn't get hidden under it

        repeating-linear-gradient(135deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 5px)`,
      backgroundBlendMode: "normal, overlay",
      fontFamily: "'Zen Kaku Gothic New', sans-serif",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
        * { -webkit-tap-highlight-color: transparent; }
        .brb-btn { transition: transform 0.08s ease; }
        .brb-side-btn:active { transform: scale(0.94); }
        .brb-btn:active { transform: scale(0.90); filter: brightness(1.25); }
        @keyframes brbBounce {
          0% { transform: scale(1); }
          30% { transform: scale(0.88, 1.1); }
          55% { transform: scale(1.07, 0.94); }
          100% { transform: scale(1); }
        }
        .brb-btn-flash { animation: brbBounce 0.4s ease-out; }
        @keyframes brbCheckPop {
          0% { opacity: 0; transform: scale(0.3) translateY(4px); }

              <button onClick={saveImage} disabled={total === 0} style={{ padding: "12px 0", borderRadius: 10, border: `1px solid ${INK.creamDim}`, background: "transparent", color: total === 0 ? INK.brassDim : INK.creamDim, fontSize: 17, fontWeight: 700, cursor: total === 0 ? "default" : "pointer", opacity: total === 0 ? 0.6 : 1 }}>📷 画像保存</button>
              {!confirmReset ? (
                <button onClick={() => setConfirmReset(true)} disabled={total === 0} style={{ padding: "12px 0", borderRadius: 10, border: `1px solid ${INK.player}`, background: "transparent", color: total === 0 ? INK.brassDim : INK.player, fontSize: 17, fontWeight: 700, cursor: total === 0 ? "default" : "pointer", opacity: total === 0 ? 0.6 : 1 }}>🗑 リセット(保存せず消去)</button>
              ) : (
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={doReset} style={{ flex: 1, padding: "12px 0", borderRadius: 10, border: "none", background: INK.player, color: INK.paper, fontSize: 17, fontWeight: 700, cursor: "pointer" }}>本当に消去する</button>
                  <button onClick={() => setConfirmReset(false)} style={{ padding: "12px 20px", borderRadius: 10, border: `1px solid ${INK.creamDim}`, background: "transparent", color: INK.creamDim, fontSize: 17, cursor: "pointer" }}>取消</button>
                </div>
              )}
            </div>
          </div>

          {/* past sessions */}
          <div style={{ margin: "0 16px 20px" }}>
            <div style={{ fontSize: 15, color: INK.brass, marginBottom: 8, letterSpacing: "0.05em" }}>過去の記録 ({sessions.length})</div>
            {sessions.length === 0 ? (
              <div style={{ background: INK.paper, borderRadius: 8, padding: 16, textAlign: "center", color: INK.brassDim, fontSize: 15 }}>保存された記録はまだありません</div>
            ) : (
              sessions.map((s) => {
                const isOpen = expandedSession === s.id;
                const rd = isOpen ? computeBigRoad(s.history, s.settings) : null;
                const sCols = isOpen ? Array.from({ length: Math.max(rd.cols, 1) }, (_, c) => c) : [];
                const sUnit = (CURRENCY_CONFIG[s.settings.currency] || CURRENCY_CONFIG.KRW).unit;
                const sFmt = (n) => { const r = Math.round(n); return `${r > 0 ? "+" : ""}${r.toLocaleString()}${sUnit}`; };
                return (
                  <div key={s.id} style={{ background: INK.paper, borderRadius: 8, padding: 12, marginBottom: 8 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }} onClick={() => setExpandedSession(isOpen ? null : s.id)}>
                      <div>
                        <div style={{ fontSize: 14, fontWeight: 700, color: "#333" }}>{new Date(s.startTs).toLocaleDateString()} {new Date(s.startTs).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}〜</div>
                        <div style={{ fontSize: 12, color: INK.brassDim }}>{s.total}局　B{s.b} P{s.p} T{s.t}</div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: 16, color: s.net > 0 ? INK.win : s.net < 0 ? INK.player : "#333" }}>{sFmt(s.net)}</div>
                        <div style={{ fontSize: 12, color: INK.brassDim }}>{s.wins}-{s.losses}-{s.pushes}</div>
                      </div>
                    </div>
                    {isOpen && (
                      <div style={{ marginTop: 10 }}>
                        <div className="brb-scroll" style={{ overflowX: "auto" }}>
                          <div style={{ display: "flex" }}>
                            {sCols.map((c) => (
                              <div key={c} style={{ display: "flex", flexDirection: "column" }}>
                                {Array.from({ length: MAX_ROWS }, (_, r) => <BigRoadCell key={r} cell={rd.cells[`${c}-${r}`]} size={24} />)}
                              </div>
                            ))}
                          </div>
                        </div>
                        <div style={{ marginTop: 10 }}>
                          <div style={{ fontSize: 12, color: INK.brassDim, marginBottom: 4 }}>このシューの傾向(保存時点)</div>
                          <div style={{ background: INK.paper, borderRadius: 8, padding: "8px 12px", fontSize: 12, color: "#555" }}>
                            {(() => {
                              const st = s.stats || computeTableStats(s.history);
                              return (
                                <>
                                  <div>勝率(タイ除く) B {st.bPctNoTie.toFixed(1)}% ／ P {st.pPctNoTie.toFixed(1)}%</div>
                                  <div style={{ marginTop: 4 }}>平均連続数 {st.avgStreak.toFixed(1)}連　ドラゴン {st.dragonCount}回　チョップ率 {st.chopRate.toFixed(0)}%</div>
                                  {st.banker6Count > 0 && <div style={{ marginTop: 4 }}>バンカー6 {st.banker6Count}回(全体{st.banker6RateOfTotal.toFixed(1)}%)</div>}
                                </>
                              );
                            })()}
                          </div>
                        </div>
                        <div style={{ marginTop: 10 }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                            <div style={{ fontSize: 12, color: INK.brassDim }}>掛け金履歴{editingHistorySessionId === s.id ? "(編集中・タップして修正)" : ""}</div>
                            <button
                              onClick={() => setEditingHistorySessionId((cur) => (cur === s.id ? null : s.id))}
                              style={{ padding: "3px 10px", borderRadius: 999, border: `1px solid ${INK.brassDim}`, background: editingHistorySessionId === s.id ? INK.brass : "transparent", color: editingHistorySessionId === s.id ? INK.feltDark : INK.brassDim, fontSize: 11, cursor: "pointer" }}
                            >
                              {editingHistorySessionId === s.id ? "完了" : "✏️ 編集"}
                            </button>
                          </div>
                          {editingHistorySessionId === s.id ? (
                            <EditablePastHistory sessionId={s.id} history={s.history} settings={s.settings} unit={sUnit} fmtTime={fmtTime} onUpdate={updatePastSessionEntry} onDelete={deletePastSessionEntry} onAdd={addPastSessionEntry} />
                          ) : (
                            <BetHistoryPanel history={s.history} settings={s.settings} unit={sUnit} fmtTime={fmtTime} />
                          )}
                        </div>
                        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                          <button
                            onClick={() => saveImage(s.history, s.settings, `${new Date(s.startTs).toLocaleDateString()} ${new Date(s.startTs).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}〜`)}
                            style={{ padding: "6px 14px", borderRadius: 999, border: `1px solid ${INK.brass}`, background: "rgba(201,162,39,0.10)", color: INK.brass, fontSize: 13, cursor: "pointer" }}
                          >
                            📷 画像を保存
                          </button>
                          <button onClick={() => deleteSession(s.id)} style={{ padding: "6px 14px", borderRadius: 999, border: `1px solid ${INK.player}`, background: "transparent", color: INK.player, fontSize: 13, cursor: "pointer" }}>この記録を削除</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })
            )}
          </div>

          {/* system info */}
          <div style={{ margin: "0 16px 8px", textAlign: "center" }}>
            <div style={{ fontSize: 12, color: INK.brassDim, fontFamily: "'JetBrains Mono', monospace" }}>
              罫線帳 v{APP_VERSION} ({APP_VERSION_DATE})
            </div>
            {meta && meta.sheetName && (
              <div style={{ fontSize: 12, color: INK.brassDim, marginTop: 2 }}>
                📊 {meta.sheetName}
              </div>
            )}
          </div>
        </div>
      )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
if (window._brbBootTimer) clearTimeout(window._brbBootTimer);
</script>
</body>
</html>
